<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdamTube</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff0000;
            padding: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .video-box {
            margin: 15px;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            width: 320px;
        }
        video {
            width: 100%;
            border-radius: 5px;
        }
        h2 {
            font-size: 1.2em;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>AdamTube</h1>
    </header>

    <div class="video-container">
        <div class="video-box">
            <video controls>
                <source src="video1.mp4" type="video/mp4">
            </video>
            <h2>Video 1</h2>
        </div>

        <div class="video-box">

        <div class="video-box">

        <div class="video-box">

</body>
</html>
